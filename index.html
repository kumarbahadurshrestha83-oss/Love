<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Tejaswi ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(135deg,#ff416c,#ff4b2b,#ff8a00);
padding:20px;
}

.card{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
padding:30px;
border-radius:25px;
text-align:center;
max-width:700px;
width:100%;
color:white;
box-shadow:0 0 25px rgba(255,255,255,0.3);
z-index:1;
}

.profile{
width:180px;
height:180px;
border-radius:50%;
object-fit:cover;
border:5px solid white;
margin-bottom:15px;
}

h1{
margin-bottom:15px;
font-size:40px;
}

#typing{
font-size:20px;
line-height:1.7;
white-space:pre-line;
min-height:300px;
}

button{
padding:12px 25px;
margin:10px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.08);
}

.yes{
background:#00c853;
color:white;
}

.no{
background:#ff1744;
color:white;
}

.special{
background:white;
color:#ff416c;
}

.heart{
position:absolute;
animation:float 8s linear infinite;
pointer-events:none;
}

@keyframes float{
from{
transform:translateY(100vh);
opacity:1;
}
to{
transform:translateY(-100px);
opacity:0;
}
}

@media(max-width:600px){

.profile{
width:130px;
height:130px;
}

h1{
font-size:28px;
}

#typing{
font-size:16px;
}

button{
font-size:15px;
padding:10px 18px;
}
}
</style>
</head>
<body>

<audio autoplay loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<div class="card">

<img src="photo.jpg" class="profile" alt="Tejaswi">

<h1>❤️ Tejaswi ❤️</h1>

<p id="typing"></p>

<button class="special" onclick="showMessage()">
Special Message ❤️
</button>

<button class="yes" onclick="yesMsg()">
Yes ❤️
</button>

<button class="no" onclick="noMsg()">
No 😢
</button>

</div>

<script>

const text =
`Dear Tejaswi,

You are a very special person to me. Every moment with you feels beautiful.

Your smile makes my day brighter and your presence makes me happy.

I wanted to be honest about my feelings.

As you know, I love cricket very much. But for you, I can even quit playing cricket. If you tell me not to play cricket, I won't play cricket because your happiness means a lot to me.

💓 Please accept my feelings 🙏

I really hope you will give me a chance.

If you don't feel the same way, I will respect your decision.

If rejected, please don't complain later that I never told you how I felt ❤️

Thank you for reading this message.

— Suman ❤️`;

let i = 0;

function typeWriter(){
if(i < text.length){
document.getElementById("typing").innerHTML += text.charAt(i);
i++;
setTimeout(typeWriter,40);
}
}

typeWriter();

function showMessage(){
alert("❤️ Tejaswi, you are very special to me. ❤️");
}

function yesMsg(){
alert("🥰 Thank you! You made me very happy! ❤️");
}

function noMsg(){
alert("❤️ I respect your decision. Thank you for being honest.");
}

function createHeart(){

const heart = document.createElement("div");
heart.className = "heart";

const hearts = ["❤️","💕","💖","💗","💘","💝"];

heart.innerHTML = hearts[Math.floor(Math.random()*hearts.length)];

heart.style.left = Math.random()*100 + "vw";
heart.style.fontSize = (20 + Math.random()*35) + "px";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);
}

setInterval(createHeart,100);

</script>

</body>
</html>
